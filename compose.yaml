services:
  game:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - snakeknot-data:/app/data
    environment:
      NODE_ENV: production
      PORT: 5173
      DATA_DIR: /app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  snakeknot-data:
